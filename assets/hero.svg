<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Abdulla Aziz — design, engineering, AI</title>
  <desc id="heroDesc">A Swiss editorial profile banner with oversized asymmetric typography, precise rule lines, and cobalt accents.</desc>
  <defs>
    <clipPath id="wipe"><rect x="46" y="336" width="1108" height="10"/></clipPath>
    <style>
      .display{font-family:"Arial Narrow","Aptos Narrow","Helvetica Neue",Arial,sans-serif;font-weight:900}
      .sans{font-family:Inter,"Helvetica Neue",Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .rule{vector-effect:non-scaling-stroke}
      .accentLine{animation:lineShift 7s cubic-bezier(.4,0,.2,1) infinite}
      .tag{animation:typePulse 5.5s ease-in-out infinite}
      .ticker{animation:ticker 9s cubic-bezier(.4,0,.2,1) infinite}
      @keyframes lineShift{0%,18%{transform:translateX(-61%)}55%,74%{transform:translateX(0)}100%{transform:translateX(61%)}}
      @keyframes typePulse{0%,100%{letter-spacing:3.2px}50%{letter-spacing:4.1px}}
      @keyframes ticker{0%,12%{transform:translateX(0)}45%,62%{transform:translateX(10px)}100%{transform:translateX(0)}}
      @media (prefers-reduced-motion:reduce){
        .accentLine,.tag,.ticker{animation:none!important}
      }
    </style>
  </defs>

  <rect width="1200" height="390" fill="#F5F3EF"/>

  <!-- top editorial register -->
  <g class="mono" font-size="10.5" fill="#151515" letter-spacing="1.6">
    <text x="46" y="34">ABDULLA AZIZ / SELECTED PRACTICE</text>
    <text x="1154" y="34" text-anchor="end">KURDISTAN / 2026</text>
  </g>
  <line x1="46" y1="50" x2="1154" y2="50" stroke="#151515" stroke-width="1" class="rule"/>
  <rect x="46" y="50" width="118" height="5" fill="#293EFF"/>

  <!-- discipline index -->
  <g class="sans" fill="#151515">
    <text x="930" y="88" font-size="10.5" font-weight="700" letter-spacing="2.4">PRACTICE / 03</text>
    <text x="930" y="119" font-size="15" font-weight="760" letter-spacing="1.2">DESIGN</text>
    <line x1="930" y1="129" x2="1154" y2="129" stroke="#151515" stroke-opacity=".35" class="rule"/>
    <text x="930" y="157" font-size="15" font-weight="760" letter-spacing="1.2">ENGINEERING</text>
    <line x1="930" y1="167" x2="1154" y2="167" stroke="#151515" stroke-opacity=".35" class="rule"/>
    <text x="930" y="195" font-size="15" font-weight="760" letter-spacing="1.2">AI</text>
    <line x1="930" y1="205" x2="1154" y2="205" stroke="#151515" stroke-opacity=".35" class="rule"/>
  </g>

  <!-- oversized asymmetric wordmark -->
  <g class="display" fill="#151515">
    <text x="40" y="176" font-size="145" letter-spacing="-8" textLength="862" lengthAdjust="spacingAndGlyphs">ABDULLA</text>
    <text x="438" y="319" font-size="170" letter-spacing="-10" textLength="718" lengthAdjust="spacingAndGlyphs">AZIZ</text>
  </g>
  <rect x="404" y="207" width="20" height="113" fill="#293EFF"/>
  <g class="ticker">
    <text x="48" y="235" class="sans" fill="#293EFF" font-size="14" font-weight="800" letter-spacing="2.4">DESIGN / ENGINEERING / AI</text>
    <text x="48" y="261" class="sans" fill="#151515" font-size="14" font-weight="520" letter-spacing=".4">Kurdish-first experiments &amp; products</text>
  </g>

  <!-- restrained project metadata -->
  <g class="mono" fill="#151515" font-size="9.5" letter-spacing="1.25">
    <text x="48" y="309">01 — LANGUAGE SYSTEMS</text>
    <text x="226" y="309">02 — PRODUCT INTERFACES</text>
    <text x="48" y="325" fill="#293EFF">OPEN / BUILD / ITERATE</text>
  </g>

  <!-- signature rule / motion -->
  <line x1="46" y1="341" x2="1154" y2="341" stroke="#151515" stroke-width="1" class="rule"/>
  <g clip-path="url(#wipe)">
    <rect class="accentLine" x="46" y="336" width="430" height="10" fill="#293EFF"/>
  </g>

  <!-- footer microtype -->
  <g class="mono" font-size="9.5" letter-spacing="1.35">
    <text x="46" y="369" fill="#151515">AA / 090</text>
    <text x="174" y="369" fill="#151515" class="tag">INDEPENDENT DIGITAL PRACTICE</text>
    <text x="1154" y="369" text-anchor="end" fill="#293EFF">MAKE USEFUL THINGS.</text>
  </g>
</svg>
