<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="indexTitle indexDesc">
  <title id="indexTitle">Abdulla Aziz — studio process index</title>
  <desc id="indexDesc">A minimal editorial strip presenting four stages: think, design, build, and ship.</desc>
  <defs>
    <style>
      .display{font-family:"Arial Narrow","Aptos Narrow","Helvetica Neue",Arial,sans-serif;font-weight:900}
      .sans{font-family:Inter,"Helvetica Neue",Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .rule{vector-effect:non-scaling-stroke}
      .scan{animation:scan 8s cubic-bezier(.4,0,.2,1) infinite}
      .word{animation:wordPulse 6s ease-in-out infinite}
      .word.w2{animation-delay:-1.5s}.word.w3{animation-delay:-3s}.word.w4{animation-delay:-4.5s}
      @keyframes scan{0%,12%{transform:scaleX(.08);transform-origin:left}48%,68%{transform:scaleX(1);transform-origin:left}100%{transform:scaleX(.08);transform-origin:right}}
      @keyframes wordPulse{0%,100%{opacity:1}50%{opacity:.72}}
      @media (prefers-reduced-motion:reduce){.scan,.word{animation:none!important}}
    </style>
  </defs>

  <rect width="1200" height="160" fill="#F5F3EF"/>
  <line x1="46" y1="24" x2="1154" y2="24" stroke="#151515" stroke-width="1" class="rule"/>
  <rect x="46" y="20" width="164" height="5" fill="#293EFF" class="scan"/>

  <g class="mono" font-size="9.5" fill="#151515" letter-spacing="1.35">
    <text x="46" y="45">WORKING METHOD / 01—04</text>
    <text x="1154" y="45" text-anchor="end">FROM QUESTION TO RELEASE</text>
  </g>

  <!-- intentionally uneven column widths: editorial rhythm, not dashboard cards -->
  <g>
    <line x1="46" y1="58" x2="46" y2="133" stroke="#151515" stroke-width="1" class="rule"/>
    <line x1="294" y1="58" x2="294" y2="133" stroke="#151515" stroke-opacity=".32" stroke-width="1" class="rule"/>
    <line x1="548" y1="58" x2="548" y2="133" stroke="#151515" stroke-opacity=".32" stroke-width="1" class="rule"/>
    <line x1="847" y1="58" x2="847" y2="133" stroke="#151515" stroke-opacity=".32" stroke-width="1" class="rule"/>
    <line x1="1154" y1="58" x2="1154" y2="133" stroke="#151515" stroke-width="1" class="rule"/>
  </g>

  <g class="mono" fill="#293EFF" font-size="11" font-weight="700" letter-spacing="1.7">
    <text x="58" y="77">01 /</text>
    <text x="306" y="77">02 /</text>
    <text x="560" y="77">03 /</text>
    <text x="859" y="77">04 /</text>
  </g>
  <g class="display" fill="#151515" font-size="43" letter-spacing="-1.8">
    <text class="word" x="58" y="119" textLength="188" lengthAdjust="spacingAndGlyphs">THINK</text>
    <text class="word w2" x="306" y="119" textLength="197" lengthAdjust="spacingAndGlyphs">DESIGN</text>
    <text class="word w3" x="560" y="119" textLength="225" lengthAdjust="spacingAndGlyphs">BUILD</text>
    <text class="word w4" x="859" y="119" textLength="204" lengthAdjust="spacingAndGlyphs">SHIP</text>
  </g>

  <line x1="46" y1="133" x2="1154" y2="133" stroke="#151515" stroke-width="1" class="rule"/>
  <g class="mono" font-size="8.5" fill="#151515" letter-spacing="1.15">
    <text x="58" y="149">FRAME THE REAL PROBLEM</text>
    <text x="306" y="149">MAKE THE IDEA LEGIBLE</text>
    <text x="560" y="149">TURN INTENT INTO SYSTEM</text>
    <text x="859" y="149" fill="#293EFF">PUT IT IN PEOPLE'S HANDS</text>
  </g>
</svg>
